name: Bug report
description: Report a reproducible AppDev Atlas issue without private data
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: "Search existing issues first. Never submit secrets, personal information or private customer data."
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Actual observed behavior without sensitive values
      placeholder: Describe the symptom and any redacted error text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Sanitized steps and relevant MCP tool name
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client and version
      placeholder: ChatGPT, Claude, Cursor, or other client and version
  - type: input
    id: version
    attributes:
      label: AppDev Atlas version (if known)
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-safety check
      options:
        - label: I checked that this report contains no credentials, private account records or other sensitive information
          required: true
